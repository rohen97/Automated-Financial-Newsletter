      - US Federal Reserve inflation yields jobs
      - ECB Europe growth inflation
      - China Singapore APAC growth markets
  private_markets:
    queries:
      - private equity exits fundraising
      - private credit direct lending fundraising
      - private markets secondaries LP liquidity
  regional:
    queries:
      - US markets Federal Reserve inflation
      - Europe markets ECB growth
      - UK markets Bank of England
      - Asia Pacific markets China Singapore
      - EMEA markets credit geopolitical risk
      - global markets macro rates
  portfolio_linked:
    queries:
      - Alibaba BMW Allianz Singapore Airlines Sembcorp RWE Sanofi ING SATS
      - Singapore Airlines SATS oil travel demand
      - Alibaba China internet ecommerce regulation
  central_banks:
