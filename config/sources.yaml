live_fetch: true
source_quality:
  Reuters: 0.95
  Bloomberg: 0.95
  Financial Times: 0.92
  CNBC: 0.80
  Federal Reserve: 0.95
  FRED: 0.95
  IMF: 0.90
  European Central Bank: 0.95
  ECB Statistical Press Releases: 0.95
  U.S. Bureau of Labor Statistics: 0.95
