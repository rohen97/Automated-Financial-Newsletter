include_chart_of_the_week: true
include_fixed_income_monitor: false
chart_mode: "fred_intelligent_selector"
fred_chart_selector:
  enabled: true
  min_signal_score: 0.0
  avoid_repeat_weeks: 2
  allow_repeat_if_score_advantage_pct: 25
  default_chart_id: "us_10y_yield"
fred_chart_candidates:
  - id: us_10y_yield
    series: ["DGS10"]
    unit_label: "%"
    lookback_months: 12
    chart_type: line
    title: "Chart of the Week: US 10Y Yield Remains the Key Discount-Rate Anchor"
    relevance: "Rates, discount rates, equity multiples, REITs, growth equities, FX"
  - id: yield_curve
    series: ["T10Y2Y"]
    unit_label: "percentage points"
    lookback_months: 60
    chart_type: line
    title: "Chart of the Week: US Yield Curve Still Frames Growth Risk"
    relevance: "Growth cycle, recession risk, banks, cyclicals, credit"
  - id: high_yield_spreads
    series: ["BAMLH0A0HYM2"]
    unit_label: "percentage points"
    lookback_months: 36
    chart_type: line
    title: "Chart of the Week: High-Yield Spreads and the Private-Market Liquidity Window"
    relevance: "Credit risk, private markets, refinancing, risk appetite"
  - id: financial_stress
    series: ["STLFSI4"]
    unit_label: "index"
    lookback_months: 36
    chart_type: line
    title: "Chart of the Week: Financial Stress and Risk Appetite"
    relevance: "Cross-asset risk, credit, liquidity, drawdown risk"
  - id: inflation_path
    series: ["CPIAUCSL"]
    unit_label: "% YoY"
    transformation:
      CPIAUCSL: yoy_pct_change
    lookback_months: 60
    chart_type: line
    title: "Chart of the Week: Inflation Progress and the Rate-Cut Path"
    relevance: "Inflation, central banks, real yields, FX, equity duration"
  - id: labour_market
    series: ["UNRATE"]
    unit_label: "%"
    lookback_months: 60
    chart_type: line
    title: "Chart of the Week: Labour-Market Cooling and the Fed Reaction Function"
    relevance: "Fed policy, recession risk, consumption, cyclicals"
  - id: real_rates
    series: ["DFII10"]
    unit_label: "%"
    lookback_months: 36
    chart_type: line
    title: "Chart of the Week: Real Rates and Duration-Sensitive Assets"
    relevance: "Gold, growth equities, REITs, long-duration assets"
  - id: policy_vs_inflation
    series: ["FEDFUNDS", "CPIAUCSL"]
    unit_label: "%"
    transformation:
      CPIAUCSL: yoy_pct_change
    lookback_months: 60
    chart_type: multi_line
    title: "Chart of the Week: Policy Rate Versus Inflation"
    relevance: "Policy restrictiveness, rate-cut timing, USD, equity multiples"
chart_image_embedding:
  enabled: true
  compliance_approved: true
  mode: "generate_internal"
  allow_hotlinking: false
  cache_external_images: false
  local_output_filename: "chart_of_the_week.png"
