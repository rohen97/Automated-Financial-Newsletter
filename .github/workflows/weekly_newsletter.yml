name: Weekly Newsletter

on:
  schedule:
    # GitHub cron is UTC. 01:00 UTC is 09:00 Asia/Singapore.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      send:
        description: Send the finalized V2 after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    env:
      TIMEZONE: Asia/Singapore
      ALLOW_FALLBACK_IN_SEND: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'gmail_api' }}
      GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
      NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
      FT_API_KEY: ${{ secrets.FT_API_KEY }}
      FT_API_ORG_NAME: WolfResearch
      FT_API_TRACKING_SOURCE: email
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TIINGO_NEWS_ENABLED: ${{ vars.TIINGO_NEWS_ENABLED || 'false' }}
      TIINGO_ALLOW_PERSISTENCE: ${{ vars.TIINGO_ALLOW_PERSISTENCE || 'false' }}
      TIINGO_LICENSE_MODE: ${{ vars.TIINGO_LICENSE_MODE || 'internal' }}
      CRUNCHBASE_API_KEY: ${{ secrets.CRUNCHBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore narrative trend history
        uses: actions/cache@v4
        with:
          path: data/trends/ngram_history.json
          key: narrative-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            narrative-history-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Generate newsletter data and standard outputs
        env:
          SEND_MODE: dry_run
        run: python -m src.main
      - name: Build finalized V2
        run: python scripts/preview_review_v2.py
      - name: Deliver finalized V2
        env:
          # A scheduled run is a real delivery attempt. Missing credentials must fail
          # visibly instead of producing a misleading successful dry run.
          SEND_MODE: ${{ (github.event_name == 'schedule' || inputs.send == true) && 'send' || 'dry_run' }}
        run: python scripts/send_review_v2.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-output
          path: output/
